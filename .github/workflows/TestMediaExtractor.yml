name: TestMediaExtractor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-media-extractor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 yt-dlp

      - name: Run media extractor test
        run: |
          python A0_Test_MediaExtractor.py

      - name: Commit and push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add A1_Test_MediaExtractor.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update A1_Test_MediaExtractor"
            git push
          fi
