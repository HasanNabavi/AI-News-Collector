name: V1 Pipeline

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ---------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------
      # 2. Setup Python
      # ---------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------
      # 4. Run the complete pipeline
      # ---------------------------------------------
      - name: Run A0 Pipeline
        run: |
          python A0_MAIN.py

      # ---------------------------------------------
      # 5. Commit generated JSON files
      # ---------------------------------------------
      - name: Commit JSON outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            A1_RunState.json \
            A2_RunCounter.json \
            B1_News.json \
            C1_NewsAfterLinkEquivalencyRun.json \
            E1_NewsAfterScrapingRun.json \
            F1_NewsAfterAIGroupingRun.json \
            G1_NewsAfterAIContentGenerationRun.json \
            H1_TelegramFormatedNews.json \
            I1_TelegramPublishReport.json

          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "Update V1 pipeline outputs"
            git push
          fi
