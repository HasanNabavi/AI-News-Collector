name: A_B_C

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI News Pipeline
        run: python A0_MAIN.py

      - name: Commit updated pipeline files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add A1_RunState.json
          git add A2_RunCounter.json
          git add B1_News.json
          git add C1_NewsAfterLinkEquivalencyRun.json

          git commit -m "Run AI news pipeline" || echo "No changes to commit"

          git push
