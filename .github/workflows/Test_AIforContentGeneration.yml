name: Test AI Headline Translation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-ai-headline-translation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run headline translation test
        id: run_test
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python Test_AIforContentGeneration/Test_AIforContentGeneration.py

      - name: Validate output JSON
        id: validate_output
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          output_file = Path(
              "Test_AIforContentGeneration/"
              "Test_AIforContentGeneration.json"
          )

          if not output_file.exists():
              print(f"ERROR: Output file not found: {output_file}")
              sys.exit(1)

          try:
              with output_file.open("r", encoding="utf-8") as file:
                  data = json.load(file)
          except Exception as exc:
              print(f"ERROR: Invalid JSON: {exc}")
              sys.exit(1)

          if not isinstance(data, dict):
              print("ERROR: Root JSON value must be an object.")
              sys.exit(1)

          metadata = data.get("test_metadata", {})
          if metadata.get("method") != "headline_translation_en_to_fa":
              print("ERROR: Unexpected test method.")
              sys.exit(1)

          results = data.get("translation_results")

          if not isinstance(results, dict) or not results:
              print("ERROR: Missing translation results.")
              sys.exit(1)

          if data.get("article_count") != len(results):
              print("ERROR: article_count does not match results.")
              sys.exit(1)

          failed = []

          for article_id, result in results.items():
              if not isinstance(result, dict):
                  print(f"ERROR: Invalid result for article {article_id}.")
                  sys.exit(1)

              if not result.get("input_title"):
                  print(f"ERROR: Missing input title for {article_id}.")
                  sys.exit(1)

              if result.get("status") != "success":
                  failed.append(article_id)
                  print(
                      f"FAILED: Article {article_id}: "
                      f"{result.get('error', 'Unknown error')}"
                  )
                  continue

              translated = result.get("translated_title")

              if not isinstance(translated, str) or not translated.strip():
                  print(
                      f"ERROR: Missing translated title for {article_id}."
                  )
                  sys.exit(1)

              print(f"Article {article_id}: success")
              print(f"Original: {result['input_title']}")
              print(f"Persian:  {translated}")
              print(f"Tokens:   {result.get('total_tokens', 0)}")
              print(
                  f"Elapsed:  {result.get('elapsed_seconds', 'unknown')}s"
              )

          if failed:
              print(f"ERROR: Failed translations: {failed}")
              sys.exit(1)

          print("Output JSON is valid.")
          print(f"Articles processed: {data['article_count']}")

          PY

      - name: Commit and push output
        if: always()
        run: |
          if [ -f "Test_AIforContentGeneration/Test_AIforContentGeneration.json" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add Test_AIforContentGeneration/Test_AIforContentGeneration.json

            if git diff --cached --quiet; then
              echo "No output changes to commit."
            else
              git commit -m "Update AI headline translation test results"
              git push
            fi
          else
            echo "Output file does not exist; nothing to commit."
          fi

      - name: Check final status
        if: always()
        run: |
          if [ "${{ steps.run_test.outcome }}" != "success" ]; then
            echo "ERROR: Headline translation test failed."
            exit 1
          fi

          if [ "${{ steps.validate_output.outcome }}" != "success" ]; then
            echo "ERROR: Output validation failed."
            exit 1
          fi

          echo "Headline translation test completed successfully."
