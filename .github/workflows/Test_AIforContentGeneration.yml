name: Test AI for Content Generation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-ai-content-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run AI content generation test
        id: run_test
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python Test_AIforContentGeneration/Test_AIforContentGeneration.py

      - name: Validate output JSON
        id: validate_output
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          output_file = Path(
              "Test_AIforContentGeneration/"
              "Test_AIforContentGeneration.json"
          )

          if not output_file.exists():
              print(f"ERROR: Output file not found: {output_file}")
              sys.exit(1)

          try:
              with output_file.open("r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              print(f"ERROR: Invalid JSON: {exc}")
              sys.exit(1)

          if not isinstance(data, dict):
              print("ERROR: Root JSON value must be an object.")
              sys.exit(1)

          if "article_count" not in data:
              print("ERROR: Missing 'article_count'.")
              sys.exit(1)

          if "method_results" not in data:
              print("ERROR: Missing 'method_results'.")
              sys.exit(1)

          method_results = data["method_results"]

          if not isinstance(method_results, dict) or not method_results:
              print("ERROR: 'method_results' must be a non-empty object.")
              sys.exit(1)

          expected_methods = {
              "method_2_english_then_persian",
          }

          found_methods = set()

          for article_id, article_result in method_results.items():
              if not isinstance(article_result, dict):
                  print(
                      f"ERROR: Results for article {article_id} "
                      "must be an object."
                  )
                  sys.exit(1)

              article_methods = set(article_result.keys())
              found_methods.update(article_methods)

              unexpected = article_methods - expected_methods
              if unexpected:
                  print(
                      f"ERROR: Unexpected methods for article {article_id}: "
                      f"{sorted(unexpected)}"
                  )
                  sys.exit(1)

          if found_methods != expected_methods:
              print(
                  "ERROR: Expected only method "
                  "'method_2_english_then_persian'."
              )
              print(f"Found methods: {sorted(found_methods)}")
              sys.exit(1)

          print("Output JSON is valid.")
          print(f"Articles processed: {data['article_count']}")
          print(f"Methods found: {sorted(found_methods)}")

          for article_id, article_result in method_results.items():
              result = article_result.get(
                  "method_2_english_then_persian", {}
              )
              status = result.get("status", "unknown")
              print(f"Article {article_id}: status={status}")

              output = result.get("output", {})
              if isinstance(output, dict):
                  print(f"Generated title: {output.get('title', '')}")
                  print(
                      "Generated text length: "
                      f"{len(output.get('text', '') or '')} characters"
                  )

          PY

      - name: Commit and push output
        if: always()
        run: |
          if [ -f "Test_AIforContentGeneration/Test_AIforContentGeneration.json" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add Test_AIforContentGeneration/Test_AIforContentGeneration.json

            if git diff --cached --quiet; then
              echo "No output changes to commit."
            else
              git commit -m "Update AI content generation test results"
              git push
            fi
          else
            echo "Output file does not exist; nothing to commit."
          fi

      - name: Check final status
        if: always()
        run: |
          if [ "${{ steps.run_test.outcome }}" != "success" ]; then
            echo "ERROR: AI content generation test failed."
            exit 1
          fi

          if [ "${{ steps.validate_output.outcome }}" != "success" ]; then
            echo "ERROR: Output validation failed."
            exit 1
          fi

          echo "AI content generation test and validation completed successfully."
