
name: Test AI Content Generation Methods

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-ai-content-generation
  cancel-in-progress: false

jobs:
  test-content-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AI content generation test
        id: run_test
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -u Test_AIforContentGeneration/Test_AIforContentGeneration.py

      - name: Validate output JSON and test results
        id: validate_output
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "Test_AIforContentGeneration/"
              "Test_AIforContentGeneration.json"
          )

          if not path.is_file():
              raise SystemExit("Output JSON was not created.")

          with path.open("r", encoding="utf-8") as file:
              data = json.load(file)

          if not isinstance(data, dict):
              raise SystemExit("Output must be a JSON object.")

          if "test_metadata" not in data:
              raise SystemExit("Missing test_metadata.")

          method_results = data.get("method_results")

          if not isinstance(method_results, dict) or not method_results:
              raise SystemExit(
                  "No article or method results were recorded."
              )

          expected_methods = {
              "method_1_direct_persian",
              "method_2_english_then_persian",
              "method_3_facts_then_persian",
          }

          failures = []

          print("Output JSON is valid.")
          print("Article count:", data.get("article_count"))

          for article_id, article in method_results.items():
              print(f"\nArticle {article_id}")

              if not isinstance(article, dict):
                  failures.append(
                      f"Article {article_id}: invalid result structure"
                  )
                  continue

              for method_name in sorted(expected_methods):
                  result = article.get(method_name)

                  if not isinstance(result, dict):
                      failures.append(
                          f"Article {article_id}: "
                          f"{method_name} has no result"
                      )
                      print(f"{method_name}: MISSING")
                      continue

                  status = result.get("status")
                  print(
                      f"{method_name}: "
                      f"status={status}, "
                      f"requests={result.get('request_count')}, "
                      f"elapsed="
                      f"{result.get('wall_clock_elapsed_seconds')}s"
                  )

                  if status != "success":
                      error = result.get("error", "Unknown error")
                      failures.append(
                          f"Article {article_id}, {method_name}: "
                          f"{error}"
                      )

          if failures:
              print("\nFailed checks:")
              for failure in failures:
                  print("-", failure)
              raise SystemExit(
                  f"Validation failed: {len(failures)} problem(s)."
              )

          print("\nAll expected methods succeeded.")
          PY

      - name: Commit and push output
        id: commit_push
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          OUTPUT_FILE="Test_AIforContentGeneration/Test_AIforContentGeneration.json"

          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "::error::Output file does not exist."
            exit 1
          fi

          git add "$OUTPUT_FILE"

          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update AI content generation test results"
          fi

          git push origin HEAD:main

      - name: Report final status
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.run_test.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate_output.outcome }}
          PUSH_OUTCOME: ${{ steps.commit_push.outcome }}
        run: |
          echo "Test: $TEST_OUTCOME"
          echo "Output validation: $VALIDATION_OUTCOME"
          echo "Commit and push: $PUSH_OUTCOME"

          if [ "$PUSH_OUTCOME" != "success" ]; then
            echo "::error::Output commit/push failed."
            exit 1
          fi

          if [ "$VALIDATION_OUTCOME" != "success" ]; then
            echo "::error::Output validation failed."
            exit 1
          fi

          if [ "$TEST_OUTCOME" != "success" ]; then
            echo "::error::The AI content generation test failed."
            exit 1
          fi

          echo "All checks passed."
