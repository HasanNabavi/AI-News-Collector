
name: Test AI Content Generation Models

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-ai-content-generation
  cancel-in-progress: false

jobs:
  test-models:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "Ollama server is ready."
              exit 0
            fi
            sleep 2
          done

          echo "Ollama server failed to start."
          cat /tmp/ollama.log
          exit 1

      - name: Download Qwen model
        run: ollama pull qwen3:4b

      - name: Download Gemma model
        run: ollama pull gemma3:4b

      - name: Run content generation test
        run: |
          python Test_AIforContentGeneration/Test_AIforContentGeneration.py

      - name: Validate test output
        run: |
          python -c "import json; from pathlib import Path; p=Path('Test_AIforContentGeneration/Test_AIforContentGeneration.json'); assert p.is_file(), 'Output file was not created'; d=json.loads(p.read_text(encoding='utf-8')); assert 'model_results' in d, 'Missing model_results'; print('Output JSON is valid.'); print('Articles:', d.get('article_count'))"

      - name: Commit and push test results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Test_AIforContentGeneration/Test_AIforContentGeneration.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update AI content generation test results"
            git push origin HEAD:main
          fi

      - name: Show output file
        if: always()
        run: |
          if [ -f Test_AIforContentGeneration/Test_AIforContentGeneration.json ]; then
            ls -lh Test_AIforContentGeneration/Test_AIforContentGeneration.json
          else
            echo "Output file does not exist."
          fi
