name: Probe BBC Video

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BBC video probe
        run: python Probe_BBC_Video.py

      - name: Commit probe output
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add Probe_BBC_Video_Output.json

          git commit -m "Update BBC video probe output" || echo "No changes to commit"

          git push
