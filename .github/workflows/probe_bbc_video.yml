name: Probe BBC Video

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BBC video probe
        run: python Probe_BBC_Video.py

      - name: Show probe output
        run: cat Probe_BBC_Video_Output.json
