name: F_G_H_I

on:
  workflow_dispatch:

jobs:
  ai-news-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Grouping
        run: |
          python F0_AIGrouping.py

      - name: Check F1 output
        run: |
          ls -lh F1_NewsAfterAIGroupingRun.json

      - name: Run AI Content Generation
        run: |
          python G0_AIContentGenerator.py

      - name: Check G1 output
        run: |
          ls -lh G1_NewsAfterAIContentGenerationRun.json

      - name: Run Telegram Formatting
        run: |
          python H0_TelegramFormatedNews.py

      - name: Check H1 output
        run: |
          ls -lh H1_TelegramFormatedNews.json

      - name: Run Telegram Interface
        run: |
          python I0_TelegramInterface.py

      - name: Check I1 report
        run: |
          ls -lh I1_TelegramPublishReport.json

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add F1_NewsAfterAIGroupingRun.json
          git add G1_NewsAfterAIContentGenerationRun.json
          git add H1_TelegramFormatedNews.json
          git add I1_TelegramPublishReport.json

          git diff --cached --quiet || git commit -m "Update F1, G1, H1 and I1 pipeline results"

          git push
